[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "violet-trace"
version = "0.1.0"
description = "A safe purple-team validation harness for defensive telemetry and detection-rule tests."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
violet-trace = "violettrace.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
